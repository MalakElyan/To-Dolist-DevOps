stages:
  - build
  - test
  - docker_build
  - release
  - deploy

build:
  stage: build
  image: python:3.10
  script:
    - pip install -r requirements.txt
    - echo "Build complete"

test:
  stage: test
  image: python:3.10
  variables:
    PYTHONPATH: "$CI_PROJECT_DIR"
  script:
    - pip install -r requirements.txt
    - python -m unittest discover -s tests -p "test_*.py"

docker_build:
  stage: docker_build
  image: docker:24.0.5  # نسخة حديثة من Docker CLI
  services:
    - docker:24.0.5-dind  # Docker in Docker
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest

release:
  stage: release
  image: alpine:latest
  script:
    - echo "Release created: v1.0.${CI_PIPELINE_IID}"
    - echo "Release info: image=${CI_REGISTRY_IMAGE}:latest"
  only:
    - main
