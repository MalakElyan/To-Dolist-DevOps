stages:
  - build
  - test
  - docker_build
  - release

build:
  stage: build
  image: python:3.10
  script:
    - pip install -r requirements.txt
    - echo "Build complete"
  only:
    - dev
    - staging
    - main

test:
  stage: test
  image: python:3.10
  script:
    - pip install -r requirements.txt
    - python -m unittest discover -s tests -p "test_*.py"
  only:
    - dev
    - staging
    - main

docker_build:
  stage: docker_build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  only:
    - dev
    - staging
    - main

release:
  stage: release
  image: alpine:latest
  script:
    - echo "Release created: v1.0.${CI_PIPELINE_IID} for branch $CI_COMMIT_REF_NAME"
    - echo "Image: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
  only:
    - main
