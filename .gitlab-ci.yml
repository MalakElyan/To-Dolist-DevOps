stages:
  - build
  - test
  - docker_build
  - release
  - deploy

build:
  stage: build
  image: python:3.10
  script:
    - pip install -r requirements.txt
    - echo "Build complete"

test:
  stage: test
  image: python:3.10
  script:
    - pip install -r requirements.txt
    - python -m unittest discover -s tests -p "test_*.py"

docker_build:
  stage: docker_build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME

release:
  stage: release
  image: alpine:latest
  script:
    - echo "Release created: $CI_COMMIT_REF_NAME"
  only:
    - main
    - staging
    - dev

deploy_dev:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Deploying to dev environment"
    - docker pull $CI_REGISTRY_IMAGE:dev
    - docker run -d -p 5000:5000 $CI_REGISTRY_IMAGE:dev
  environment:
    name: dev
    url: https://dev.yourapp.com
  only:
    - dev

deploy_staging:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Deploying to staging environment"
    - docker pull $CI_REGISTRY_IMAGE:staging
    - docker run -d -p 5000:5000 $CI_REGISTRY_IMAGE:staging
  environment:
    name: staging
    url: https://staging.yourapp.com
  only:
    - staging

deploy_production:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Deploying to production environment"
    - docker pull $CI_REGISTRY_IMAGE:main
    - docker run -d -p 5000:5000 $CI_REGISTRY_IMAGE:main
  environment:
    name: production
    url: https://yourapp.com
  only:
    - main
