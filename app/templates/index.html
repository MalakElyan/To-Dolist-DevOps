<!DOCTYPE html>
<html>
<head>
    <title>Todo List</title>
</head>
<body>
    <h1>My Tasks</h1>
    <ul>
        {% for todo in todos %}
        <li>
            {{ todo['task'] }}
            <a href="{{ url_for('todo.delete_todo', todo_id=todo['id']) }}">Delete</a>
        </li>
        {% else %}
        <li>No tasks yet.</li>
        {% endfor %}
    </ul>

    <h2>Add Task</h2>
    <form method="POST" action="{{ url_for('todo.add_todo_html') }}">
        <input type="text" name="task" placeholder="New task">
        <button type="submit">Add</button>
    </form>
</body>
</html>
