<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 1rem;
            background-color: #f9f9f9;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .add-btn {
            font-size: 1.5rem;
            padding: 0.3rem 0.8rem;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 50%;
        }
        .search-bar {
            width: 100%;
            margin: 1rem 0;
        }
        .search-bar input {
            width: 100%;
            padding: 0.6rem;
            border-radius: 10px;
            border: 1px solid #ccc;
        }
        .section {
            margin-bottom: 2rem;
        }
        .section h3 {
            border-bottom: 2px solid #ccc;
            padding-bottom: 0.5rem;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: white;
            margin: 0.5rem 0;
            padding: 1rem;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <header>
        <h1>My Tasks</h1>
        <button class="add-btn">+</button>
    </header>

    <div class="search-bar">
        <input type="text" placeholder="Search tasks...">
    </div>

    <div class="section">
        <h3>Ongoing Tasks</h3>
        <ul id="ongoing-tasks">
            <li>Learn Flask</li>
            <li>Build To-Do App</li>
        </ul>
    </div>

    <div class="section">
        <h3>Completed Tasks</h3>
        <ul id="completed-tasks">
            <li><s>Setup project</s></li>
        </ul>
    </div>
</body>
</html>
