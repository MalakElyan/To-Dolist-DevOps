<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    // تحميل المهام عند تحميل الصفحة
    window.onload = function () {
      fetchTodos();
    };

    function fetchTodos() {
      fetch('/todos')
        .then(response => response.json())
        .then(data => {
          const list = document.getElementById('todo-list');
          list.innerHTML = '';
          data.forEach(todo => {
            const li = document.createElement('li');
            li.className = 'list-group-item';
            li.innerText = todo.task;
            list.appendChild(li);
          });
        });
    }

    function addTodo(event) {
      event.preventDefault();
      const taskInput = document.getElementById('task');
      const task = taskInput.value;

      fetch('/todos', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ task })
      })
      .then(response => {
        if (response.ok) {
          taskInput.value = '';
          fetchTodos();
        } else {
          alert("حدث خطأ أثناء إضافة المهمة");
        }
      });
    }
  </script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4 text-center">📝 Todo List</h1>

    <form onsubmit="addTodo(event)" class="mb-4">
      <div class="input-group">
        <input type="text" id="task" class="form-control" placeholder="أضف مهمة جديدة" required>
        <button class="btn btn-primary" type="submit">إضافة</button>
      </div>
    </form>

    <ul id="todo-list" class="list-group">
      <!-- سيتم تعبئة المهام هنا -->
    </ul>
  </div>
</body>
</html>
