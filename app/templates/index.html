<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Tasks</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* تنسيقات بسيطة للنافذة المنبثقة */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }
    .close {
      float: right;
      font-size: 20px;
      cursor: pointer;
    }
    input, label {
      display: block;
      width: 100%;
      margin: 10px 0;
    }
    button {
      padding: 10px 15px;
      background-color: #007BFF;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>My Tasks</h1>
  <button id="openModal">+</button>
  <input type="text" placeholder="Search tasks..." />

  <!-- زر الإضافة يفتح النموذج -->
<button onclick="document.getElementById('add-form').style.display='block'">+</button>

<!-- نموذج إضافة المهمة -->
<div id="add-form" style="display:none; margin-top: 20px;">
    <form method="POST" action="{{ url_for('todo.add_todo_html') }}">
        <input type="text" name="task" placeholder="Task name" required><br><br>
        <label>Due Date:</label>
        <input type="date" name="due_date"><br><br>
        <label>
            <input type="checkbox" name="reminder"> Set Reminder
        </label><br><br>
        <button type="submit">Save</button>
        <button type="button" onclick="document.getElementById('add-form').style.display='none'">Cancel</button>
    </form>
</div>

  <ul>
    {% for todo in todos if todo['completed'] %}
      <li><s>{{ todo['task'] }}</s></li>
    {% endfor %}
  </ul>

  <!-- نافذة الإضافة -->
  <div id="taskModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <form method="POST" action="/add">
        <label for="task">Task</label>
        <input type="text" name="task" required>

        <label for="due_date">Due Date</label>
        <input type="date" name="due_date">

        <label>
          <input type="checkbox" name="reminder"> Reminder
        </label>

        <button type="submit">تم</button>
      </form>
    </div>
  </div>

  <script>
    const modal = document.getElementById("taskModal");
    const openBtn = document.getElementById("openModal");
    const closeBtn = document.getElementById("closeModal");

    openBtn.onclick = () => modal.style.display = "flex";
    closeBtn.onclick = () => modal.style.display = "none";
    window.onclick = (e) => {
      if (e.target === modal) modal.style.display = "none";
    };
  </script>

</body>
</html>
