<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edit Task</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        input[type="text"],
        input[type="date"] {
            padding: 12px 16px;
            font-size: 18px;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            transition: border-color 0.3s;
            width: 100%;
        }
        input[type="text"]:focus,
        input[type="date"]:focus {
            border-color: #2980b9;
            outline: none;
        }
        label {
            font-weight: bold;
            margin-top: 10px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #1e874b;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
            border: 1.5px solid #2980b9;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background-color 0.3s, color 0.3s;
        }
        a:hover {
            background-color: #2980b9;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Edit Task</h1>
    <form method="POST" action="{{ url_for('todo.update_todo', todo_id=todo['id']) }}">
        <label for="task">Task</label>
        <input type="text" id="task" name="task" value="{{ todo['task'] }}" required />

        <label for="due_date">Due Date</label>
        <input type="date" id="due_date" name="due_date" value="{{ todo['due_date'] if todo['due_date'] else '' }}">

        <label>
            <input type="checkbox" name="reminder" {% if todo['reminder'] %}checked{% endif %}>
            Set Reminder
        </label>

        <button type="submit">Save</button>

        <label>
            <input type="checkbox" name="completed" {% if todo['completed'] %}checked{% endif %}>
            Mark as Completed
          </label>
          
    </form>
    <a href="{{ url_for('todo.index') }}">Back to List</a>
</body>
</html>
